<!doctype html><html><body style="margin:0;background:#cfc9bd">
<canvas id="c"></canvas>
<script type="module">
import { drawAvatar, drawPortrait } from '/src/game/avatar.ts';
import { npcAvatar, BOT_NAMES } from '/src/game/bots.ts';
const c = document.getElementById('c');
const W = 1400, H = 820; c.width = W; c.height = H;
const ctx = c.getContext('2d');
const q = new URLSearchParams(location.search);
const L = [
  { gender: 'male', skin: '#c98e62', hair: 'short', hairColor: '#1b1b1b', outfit: 'hoodie', outfitColor: '#2d5bd1', accessory: 'none', beard: 'stubble' },
  { gender: 'male', skin: '#4f2f1c', hair: 'fade', hairColor: '#1b1b1b', outfit: 'suit', outfitColor: '#222831', accessory: 'none', beard: 'beard' },
  { gender: 'male', skin: '#f5d2b8', hair: 'curly', hairColor: '#8a5a2b', outfit: 'hivis', outfitColor: '#f2a03d', accessory: 'none', beard: 'tache' },
  { gender: 'female', skin: '#f5d2b8', hair: 'long', hairColor: '#d9b44a', outfit: 'dress', outfitColor: '#ff6fa8', accessory: 'none', beard: 'none' },
  { gender: 'female', skin: '#6e3f25', hair: 'braids', hairColor: '#1b1b1b', outfit: 'puffer', outfitColor: '#7a3fd1', accessory: 'none', beard: 'none' },
  { gender: 'female', skin: '#d9a37a', hair: 'ponytail', hairColor: '#4a2f1f', outfit: 'tracksuit', outfitColor: '#1f8a5b', accessory: 'none', beard: 'none' },
  { gender: 'other', skin: '#a86b45', hair: 'bun', hairColor: '#1b1b1b', outfit: 'mac', outfitColor: '#8d6e63', accessory: 'glasses', beard: 'none' },
  { gender: 'other', skin: '#eabd98', hair: 'mohawk', hairColor: '#e05fa8', outfit: 'knit', outfitColor: '#2a9d8f', accessory: 'none', beard: 'none' },
  { gender: 'other', skin: '#8c5634', hair: 'afro', hairColor: '#3a7bd5', outfit: 'hoodie', outfitColor: '#e6e6e6', accessory: 'headphones', beard: 'none' },
];
const looks = q.get('npcs') ? BOT_NAMES.map(npcAvatar) : L;
const S = 4.2;
looks.forEach((a, i) => {
  const x = 70 + i * (1300 / looks.length);
  ctx.setTransform(S, 0, 0, S, x, 300);
  drawAvatar(ctx, a, { facing: 'down', moving: false, t: 0.5 });
  ctx.setTransform(S, 0, 0, S, x, 580);
  drawAvatar(ctx, a, { facing: 'right', moving: true, t: 0.12 });
  ctx.setTransform(1, 0, 0, 1, x - 40, 640);
  drawPortrait(ctx, a, 80);
});
window.done = true;
</script></body></html>
